# Dan's Microsite Standards from here down
edit_uri: 'blob/master/docs'
theme:
  name: material
  custom_dir: overrides
  static_templates:
    - 404.html
  logo: img/mascot/welcome.png
  favicon: img/favicon.ico
  palette:
    primary: 'blue'
    accent: 'orange'
  include_sidebar: true
  features:
    - content.code.copy
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - toc.follow
    - navigation.top
    # this adds the prev and next icons in the footer
    - navigation.footer
plugins:
  - search
  - social
# Hooks -- loaded as raw Python modules, not plugins (avoids name collisions).
# `plugins/social_override.py` overrides og:image and twitter:image with the
# page's `image:` frontmatter value when present. Pages without `image:` are
# untouched -- mkdocs-material's default meta tags (and the social plugin's
# generated card) pass through.
hooks:
  - plugins/social_override.py
exclude_docs: |
  labs/TODO.md
  learning-graph/README.md
  setup/safe-power-for-learning/image-prompts.md
  sims/actuator-family-explorer/image-prompt.md
  sims/battery-type-explorer/image-prompt.md
  sims/capacitor-family-explorer/image-prompt.md
  sims/capstone-inspiration-explorer/image-prompt.md
  sims/component-markings-explorer/image-prompt.md
  sims/multi-led-configuration-explorer/image-prompt.md
  sims/power-source-chooser/image-prompt.md
  sims/resistor-family-infographic/image-prompt.md
  sims/switch-family-explorer/image-prompt.md
  sims/transistor-family-explorer/image-prompt.md
markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - pymdownx.highlight:
      linenums: true
  # Enable KaTeX LaTeX equation rendering
  # Using \(...\) for inline math to avoid conflicts with currency $
  # Block math uses \[...\]
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: ['round']
      block_syntax: ['square']

extra_css:
  - css/extra.css
  - css/mascot.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css

extra_javascript:
  - js/extras.js
  - js/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
copyright: Copyright &copy; 2025 Dan McCreary. Licensed under <a href="license/">CC BY-NC-SA 4.0</a> for non-commercial use.
extra:
  # Page status markers shown in the nav. Set `status:` in a page's frontmatter
  # to one of these keys. Icons and colors are defined in docs/css/extra.css.
  # For hands-on labs the value is derived from quality_score by the
  # hands-on-lab-evaluator skill.
  status:
    complete: "Complete - publish ready (score 90-100)"
    almost-complete: "Almost complete - minor gaps (score 80-89)"
    in-progress: "In progress - teachable but incomplete (score 65-79)"
    early-stage: "Early stage - draft (score 40-64)"
    stub: "Stub - little content yet (score 0-39)"
  analytics:
    provider: google
    property: G-WP3K3TSFJ7
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: Beginning Electronics
  textbook_version: "1.0"
  generator: false

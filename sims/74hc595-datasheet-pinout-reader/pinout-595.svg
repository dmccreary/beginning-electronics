<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img"
     aria-label="Top-down datasheet pinout of a 16-pin 74HC595, with notch and pin-1 dot at the left">
  <defs>
    <linearGradient id="chipTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B4552"/><stop offset="60%" stop-color="#262E38"/><stop offset="100%" stop-color="#1A2027"/>
    </linearGradient>
    <linearGradient id="pinMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCE1E6"/><stop offset="100%" stop-color="#98A1A9"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="560" fill="#FBFCFD"/>
  <rect x="60" y="196" width="980" height="168" fill="#ECEFF2"/>
  <rect x="60" y="264" width="980" height="32" fill="#DDE2E7"/>
  <text x="1028" y="352" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#8B95A0" text-anchor="end">breadboard centre channel</text>
  <g fill="url(#pinMetal)">
    <rect x="185" y="330" width="30" height="46" rx="3"/>
    <rect x="185" y="184" width="30" height="46" rx="3"/>
    <rect x="275" y="330" width="30" height="46" rx="3"/>
    <rect x="275" y="184" width="30" height="46" rx="3"/>
    <rect x="365" y="330" width="30" height="46" rx="3"/>
    <rect x="365" y="184" width="30" height="46" rx="3"/>
    <rect x="455" y="330" width="30" height="46" rx="3"/>
    <rect x="455" y="184" width="30" height="46" rx="3"/>
    <rect x="545" y="330" width="30" height="46" rx="3"/>
    <rect x="545" y="184" width="30" height="46" rx="3"/>
    <rect x="635" y="330" width="30" height="46" rx="3"/>
    <rect x="635" y="184" width="30" height="46" rx="3"/>
    <rect x="725" y="330" width="30" height="46" rx="3"/>
    <rect x="725" y="184" width="30" height="46" rx="3"/>
    <rect x="815" y="330" width="30" height="46" rx="3"/>
    <rect x="815" y="184" width="30" height="46" rx="3"/>
  </g>
  <rect x="170" y="226" width="720" height="108" rx="9" fill="url(#chipTop)"/>
  <path d="M170 254 a26 26 0 0 0 0 52 z" fill="#FBFCFD"/>
  <circle cx="206" cy="252" r="8" fill="#0E1216"/>
  <circle cx="206" cy="252" r="8" fill="none" stroke="#C0392B" stroke-width="2"/>
  <text x="530" y="272" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="bold" fill="#E9EDF1" text-anchor="middle">74HC595</text>
  <text x="530" y="300" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#AEB8C2" text-anchor="middle">viewed from above</text>
  <g font-family="Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="200" y="404" font-size="24" font-weight="bold" fill="#C0392B">1</text>
    <text x="200" y="426" font-size="13" fill="#5B6773">Q1</text>
    <text x="290" y="404" font-size="24" font-weight="bold" fill="#2C3742">2</text>
    <text x="290" y="426" font-size="13" fill="#5B6773">Q2</text>
    <text x="380" y="404" font-size="24" font-weight="bold" fill="#2C3742">3</text>
    <text x="380" y="426" font-size="13" fill="#5B6773">Q3</text>
    <text x="470" y="404" font-size="24" font-weight="bold" fill="#2C3742">4</text>
    <text x="470" y="426" font-size="13" fill="#5B6773">Q4</text>
    <text x="560" y="404" font-size="24" font-weight="bold" fill="#2C3742">5</text>
    <text x="560" y="426" font-size="13" fill="#5B6773">Q5</text>
    <text x="650" y="404" font-size="24" font-weight="bold" fill="#2C3742">6</text>
    <text x="650" y="426" font-size="13" fill="#5B6773">Q6</text>
    <text x="740" y="404" font-size="24" font-weight="bold" fill="#2C3742">7</text>
    <text x="740" y="426" font-size="13" fill="#5B6773">Q7</text>
    <text x="830" y="404" font-size="24" font-weight="bold" fill="#2C3742">8</text>
    <text x="830" y="426" font-size="13" fill="#5B6773">GND</text>
    <text x="200" y="168" font-size="24" font-weight="bold" fill="#C0392B">16</text>
    <text x="200" y="146" font-size="13" fill="#5B6773">VCC</text>
    <text x="290" y="168" font-size="24" font-weight="bold" fill="#2C3742">15</text>
    <text x="290" y="146" font-size="13" fill="#5B6773">Q0</text>
    <text x="380" y="168" font-size="24" font-weight="bold" fill="#2C3742">14</text>
    <text x="380" y="146" font-size="13" fill="#5B6773">SER</text>
    <text x="470" y="168" font-size="24" font-weight="bold" fill="#2C3742">13</text>
    <text x="470" y="146" font-size="13" fill="#5B6773">OE'</text>
    <text x="560" y="168" font-size="24" font-weight="bold" fill="#2C3742">12</text>
    <text x="560" y="146" font-size="13" fill="#5B6773">RCLK</text>
    <text x="650" y="168" font-size="24" font-weight="bold" fill="#2C3742">11</text>
    <text x="650" y="146" font-size="13" fill="#5B6773">SRCLK</text>
    <text x="740" y="168" font-size="24" font-weight="bold" fill="#2C3742">10</text>
    <text x="740" y="146" font-size="13" fill="#5B6773">SRCLR'</text>
    <text x="830" y="168" font-size="24" font-weight="bold" fill="#2C3742">9</text>
    <text x="830" y="146" font-size="13" fill="#5B6773">QH'</text>
  </g>
  <path d="M200 448 H830" fill="none" stroke="#E8710A" stroke-width="3"/>
  <path d="M830 448 l-12 -6 v12 z" fill="#E8710A"/>
  <path d="M200 126 H830" fill="none" stroke="#E8710A" stroke-width="3"/>
  <path d="M200 126 l12 -6 v12 z" fill="#E8710A"/>
  <text x="515" y="470" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#B4650F" text-anchor="middle">count this way from the notch</text>
  <path d="M146 280 H140" fill="none" stroke="#C0392B" stroke-width="2.5"/>
  <path d="M146 280 l-12 -6 v12 z" fill="#C0392B"/>
  <text x="136" y="252" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#C0392B" text-anchor="end">notch + dot</text>
  <text x="136" y="274" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#7A5148" text-anchor="end">both mark pin 1</text>
  <text x="550" y="60" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#5B6773" text-anchor="middle">a datasheet pinout, read from above</text>
  <text x="550" y="520" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#8B95A0" text-anchor="middle">pins 1–8 along the bottom, 9–16 back along the top</text>
</svg>

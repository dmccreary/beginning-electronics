<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img"
     aria-label="An 8-pin 555 timer and a 16-pin 74HC595 shift register, drawn side by side to relative scale">
  <defs>
    <linearGradient id="chipBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B4552"/>
      <stop offset="55%" stop-color="#262E38"/>
      <stop offset="100%" stop-color="#171D24"/>
    </linearGradient>
    <linearGradient id="pinMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D7DCE1"/>
      <stop offset="100%" stop-color="#9AA3AB"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="520" fill="#FBFCFD"/>
  <rect x="0"   y="0" width="500" height="520" fill="#EEF3FB"/>
  <rect x="500" y="0" width="500" height="520" fill="#F2F0FB"/>
  <line x1="500" y1="16" x2="500" y2="504" stroke="#D6DCE2" stroke-width="2" stroke-dasharray="7 6"/>

  <!-- ============== 555 TIMER : 8-pin DIP ============== -->
  <g>
    <!-- pins: 4 per side -->
    <g fill="url(#pinMetal)">
      <rect x="188" y="176" width="16" height="26" rx="2"/>
      <rect x="228" y="176" width="16" height="26" rx="2"/>
      <rect x="268" y="176" width="16" height="26" rx="2"/>
      <rect x="308" y="176" width="16" height="26" rx="2"/>
      <rect x="188" y="286" width="16" height="26" rx="2"/>
      <rect x="228" y="286" width="16" height="26" rx="2"/>
      <rect x="268" y="286" width="16" height="26" rx="2"/>
      <rect x="308" y="286" width="16" height="26" rx="2"/>
    </g>

    <!-- body -->
    <rect x="176" y="196" width="160" height="96" rx="7" fill="url(#chipBody)"/>
    <!-- orientation notch -->
    <path d="M176 232 a15 15 0 0 0 0 24 z" fill="#0E1216"/>
    <circle cx="200" cy="216" r="5" fill="#0E1216"/>

    <text x="256" y="238" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#E9EDF1" text-anchor="middle">NE555</text>
    <text x="256" y="266" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#AEB8C2" text-anchor="middle">TIMER</text>

    <!-- pin-count callout -->
    <text x="256" y="150" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="bold" fill="#1565C0" text-anchor="middle">8 pins</text>
    <text x="256" y="120" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6773" text-anchor="middle">4 down each side</text>

    <!-- coming-soon tag -->
    <rect x="166" y="352" width="180" height="34" rx="17" fill="#1565C0"/>
    <text x="256" y="375" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Coming in Chapter 14</text>

    <text x="256" y="428" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#2C3742" text-anchor="middle">555 Timer</text>
    <text x="256" y="456" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#5B6773" text-anchor="middle">makes pulses and delays</text>
  </g>

  <!-- ============== 74HC595 : 16-pin DIP ============== -->
  <g>
    <!-- pins: 8 per side -->
    <g fill="url(#pinMetal)">
      <rect x="616" y="176" width="16" height="26" rx="2"/>
      <rect x="652" y="176" width="16" height="26" rx="2"/>
      <rect x="688" y="176" width="16" height="26" rx="2"/>
      <rect x="724" y="176" width="16" height="26" rx="2"/>
      <rect x="760" y="176" width="16" height="26" rx="2"/>
      <rect x="796" y="176" width="16" height="26" rx="2"/>
      <rect x="832" y="176" width="16" height="26" rx="2"/>
      <rect x="868" y="176" width="16" height="26" rx="2"/>
      <rect x="616" y="286" width="16" height="26" rx="2"/>
      <rect x="652" y="286" width="16" height="26" rx="2"/>
      <rect x="688" y="286" width="16" height="26" rx="2"/>
      <rect x="724" y="286" width="16" height="26" rx="2"/>
      <rect x="760" y="286" width="16" height="26" rx="2"/>
      <rect x="796" y="286" width="16" height="26" rx="2"/>
      <rect x="832" y="286" width="16" height="26" rx="2"/>
      <rect x="868" y="286" width="16" height="26" rx="2"/>
    </g>

    <!-- body: longer, to relative scale against the 8-pin part -->
    <rect x="604" y="196" width="292" height="96" rx="7" fill="url(#chipBody)"/>
    <path d="M604 232 a15 15 0 0 0 0 24 z" fill="#0E1216"/>
    <circle cx="628" cy="216" r="5" fill="#0E1216"/>

    <text x="750" y="238" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#E9EDF1" text-anchor="middle">74HC595</text>
    <text x="750" y="266" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#AEB8C2" text-anchor="middle">SHIFT REGISTER</text>

    <text x="750" y="150" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="bold" fill="#6953B8" text-anchor="middle">16 pins</text>
    <text x="750" y="120" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#5B6773" text-anchor="middle">8 down each side</text>

    <rect x="660" y="352" width="180" height="34" rx="17" fill="#6953B8"/>
    <text x="750" y="375" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Coming in Chapter 15</text>

    <text x="750" y="428" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#2C3742" text-anchor="middle">74HC595 Shift Register</text>
    <text x="750" y="456" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#5B6773" text-anchor="middle">turns a few wires into many outputs</text>
  </g>

  <text x="500" y="44" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#7A8794" text-anchor="middle">
    both are DIP packages — count the pins and find the notch to orient them
  </text>
</svg>

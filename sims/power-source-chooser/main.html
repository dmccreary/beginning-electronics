<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1"><title>Power Source Chooser — Interactive Infographic</title><link rel="icon" href="../../img/favicon.ico"><link rel="stylesheet" href="../shared-libs/grid-overlay.css"><style>.sim-title{margin:2px 0 10px;color:#1f3349;font-size:clamp(20px,3.2vw,30px);line-height:1.15;text-align:center}.sim-subtitle{margin:-4px 0 10px;color:#526579;font-size:13px;text-align:center}.zone-chip{top:8px;max-width:calc(100% - 10px);padding:4px 9px;font-size:clamp(10px,1.6vw,13px);line-height:1.2;text-align:center;opacity:1}.grid-zone:focus-visible{border-color:var(--zone-color,#1389A6);border-width:3px;outline:3px solid white;outline-offset:-6px}#detail-panel{min-height:122px}</style></head>
